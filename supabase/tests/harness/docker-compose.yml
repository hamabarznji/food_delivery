# Lightweight stand-in for a Supabase project, used only by the automated
# tests: real Postgres + GoTrue (Supabase Auth) + PostgREST (Supabase Data API).
# Storage and Realtime are NOT part of this harness.
name: campus-eats-test
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["54422:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    volumes: ["./bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      retries: 30
  auth:
    image: supabase/gotrue:v2.170.0
    depends_on: { db: { condition: service_healthy } }
    ports: ["54499:9999"]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:54421/auth/v1
      GOTRUE_SITE_URL: http://localhost:3100
      GOTRUE_URI_ALLOW_LIST: "http://localhost:3100/**"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_JWT_SECRET: test-jwt-secret-with-at-least-32-characters
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "1000"
  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on: { db: { condition: service_healthy } }
    ports: ["54430:3000"]
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: test-jwt-secret-with-at-least-32-characters
      PGRST_DB_USE_LEGACY_GUCS: "false"
